version: 2
sql:
  - engine: "mysql"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "sqlc"
        overrides:
          - column: "dep_names.tokenpki_cert_pem"
            go_type:
              type: "byte"
              slice: true
          - column: "dep_names.tokenpki_key_pem"
            go_type:
              type: "byte"
              slice: true
          - column: "dep_names.tokenpki_staging_cert_pem"
            go_type:
              type: "byte"
              slice: true
          - column: "dep_names.tokenpki_staging_key_pem"
            go_type:
              type: "byte"
              slice: true
          # parseTime=true is assumed to not be set on the MySQL driver
          # DSN, so timestamp and datetime columns arrive as strings.
          - db_type: "timestamp"
            go_type:
              type: "string"
          - db_type: "timestamp"
            nullable: true
            go_type:
              type: "sql.NullString"
          - db_type: "datetime"
            go_type:
              type: "string"
          - db_type: "datetime"
            nullable: true
            go_type:
              type: "sql.NullString"
